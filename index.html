<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!--
      Content Security Policy for Electron file:// context.
      IMPORTANT: 'self' = file:// in a packaged app, so NO external URLs are allowed.
      All resources must be local/bundled. No CDN, no remote fonts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self';"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MarkPad — A fast, minimal Markdown workspace IDE." />
    <meta name="referrer" content="no-referrer" />

    <title>MarkPad</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
